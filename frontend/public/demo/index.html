<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edf2ee" />
  <title>司南礼客 · 七站全流程演示</title>
  <meta name="description" content="司南礼客七站全流程录屏演示：画像、学习、做题、接单、行前、行中、行后。" />
  <meta property="og:title" content="司南礼客 · 七站全流程演示" />
  <meta property="og:image" content="https://sinanlike.com/demo/media/overview.jpg" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./demo.css" />
</head>
<body>
  <main>
    <header class="masthead">
      <p class="brand">司南礼客</p>
      <h1>七站全流程</h1>
    </header>

    <section class="scene" id="profile">
      <div class="scene-title">
        <span>01</span>
        <h2>画像自测</h2>
      </div>
      <p class="scene-line">八维画像 · 学习建议</p>
      <div class="video-shell">
        <video autoplay muted loop playsinline controls preload="metadata" poster="./media/01-profile.jpg" aria-label="画像自测录屏">
          <source src="./media/01-profile.mp4" type="video/mp4" />
        </video>
      </div>
    </section>

    <section class="scene" id="learning">
      <div class="scene-title">
        <span>02</span>
        <h2>个性化学习</h2>
      </div>
      <p class="scene-line">学习地图 · 多 Agent 资源</p>
      <div class="video-shell">
        <video autoplay muted loop playsinline controls preload="metadata" poster="./media/02-learning.jpg" aria-label="个性化学习资源生成录屏">
          <source src="./media/02-learning.mp4" type="video/mp4" />
        </video>
      </div>
    </section>

    <section class="scene" id="quiz">
      <div class="scene-title">
        <span>03</span>
        <h2>动态做题</h2>
      </div>
      <p class="scene-line">答对升档 · 答错降档</p>
      <div class="video-shell">
        <video autoplay muted loop playsinline controls preload="metadata" poster="./media/03-quiz.jpg" aria-label="动态难度做题录屏">
          <source src="./media/03-quiz.mp4" type="video/mp4" />
        </video>
      </div>
    </section>

    <section class="scene" id="order">
      <div class="scene-title">
        <span>04</span>
        <h2>接单与首呼</h2>
      </div>
      <p class="scene-line">限时抢单 · 需求确认</p>
      <div class="video-shell">
        <video autoplay muted loop playsinline controls preload="metadata" poster="./media/04-order.jpg" aria-label="接单与首呼录屏">
          <source src="./media/04-order.mp4" type="video/mp4" />
        </video>
      </div>
    </section>

    <section class="scene" id="prepare">
      <div class="scene-title">
        <span>05</span>
        <h2>行前方案</h2>
      </div>
      <p class="scene-line">询价 · 方案 · 报价 · 合同</p>
      <div class="video-shell">
        <video autoplay muted loop playsinline controls preload="metadata" poster="./media/05-prepare.jpg" aria-label="行前方案与报价录屏">
          <source src="./media/05-prepare.mp4" type="video/mp4" />
        </video>
      </div>
    </section>

    <section class="scene" id="incident">
      <div class="scene-title">
        <span>06</span>
        <h2>行中应急</h2>
      </div>
      <p class="scene-line">安抚客户 · 协调资源 · 解决问题</p>
      <div class="video-shell">
        <video autoplay muted loop playsinline controls preload="metadata" poster="./media/06-incident.jpg" aria-label="行中突发事件处置录屏">
          <source src="./media/06-incident.mp4" type="video/mp4" />
        </video>
      </div>
    </section>

    <section class="scene" id="settlement">
      <div class="scene-title">
        <span>07</span>
        <h2>行后复盘</h2>
      </div>
      <p class="scene-line">结算 · 61 技能点评分 · 画像回写</p>
      <div class="video-shell">
        <video autoplay muted loop playsinline controls preload="metadata" poster="./media/07-settlement.jpg" aria-label="行后结算评分与画像回写录屏">
          <source src="./media/07-settlement.mp4" type="video/mp4" />
        </video>
      </div>
    </section>
  </main>

  <script src="./demo.js" defer></script>
</body>
</html>
