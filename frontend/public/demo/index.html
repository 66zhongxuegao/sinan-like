<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#133450" />
  <title>司南礼客使用说明</title>
  <meta name="description" content="司南礼客使用说明：按步骤完成画像测评、个性化学习、动态做题、接单首呼、行前方案、行中应急与行后复盘。" />
  <meta property="og:title" content="司南礼客使用说明" />
  <meta property="og:image" content="https://sinanlike.com/demo/media/overview.jpg" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./demo.css" />
</head>
<body>
  <header class="hero">
    <p class="brand">司南礼客</p>
    <h1>使用说明</h1>
    <p class="hero-line">左右翻页，查看 7 步具体操作</p>
  </header>

  <main class="manual-wrap">
    <div class="manual-shell">
      <button class="carousel-arrow carousel-arrow--prev" id="prev" type="button" aria-label="上一步">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>

      <div class="carousel-viewport" id="viewport" aria-roledescription="carousel" aria-label="司南礼客使用步骤">
        <div class="carousel-track" id="track"></div>
      </div>

      <button class="carousel-arrow carousel-arrow--next" id="next" type="button" aria-label="下一步">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>

    <div class="carousel-status">
      <div class="dots" id="dots" aria-label="步骤切换"></div>
      <p class="position" id="position" aria-live="polite">01 / 07</p>
    </div>
  </main>

  <script src="./demo.js" defer></script>
</body>
</html>
